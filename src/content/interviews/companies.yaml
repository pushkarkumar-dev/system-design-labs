openai:
  name: OpenAI
  kind: frontier-lab
  tracks:
  - ai-engineer
  - ai-infra
  aiToolPolicy:
    status: banned-except
    detail: interviewing.io reports AI tools are banned except in a beta 'agentic coding' onsite round
      that not every candidate gets. A first-hand 2026 Forward Deployed Engineer account describes an
      AI-enabled live coding screen; OpenAI's own guide could not be read (403).
    asOf: '2026'
    sources:
    - s-74b419b5c0
    - s-05342b6eb9
  loop:
  - stage: Recruiter call
    round: recruiter-screen
    minutes: 30
    notes: Per interviewing.io.
  - stage: Technical screen
    round: practical-coding
    minutes: 60
    notes: CoderPad. Coding is reported as practical, multi-part builds (a credit-tracking service, a
      resumable iterator, a small database) rather than LeetCode puzzles.
  - stage: System design screen
    round: system-design
    minutes: 60
    notes: Excalidraw.
  - stage: Agentic coding (beta)
    round: ai-assisted-coding
    notes: 'Onsite, not given to every candidate: work with an AI agent on a large existing codebase.
      Reported by interviewing.io only; not confirmed by OpenAI.'
  - stage: Coding
    round: practical-coding
    minutes: 60
    notes: 'A Glassdoor candidate (snippet) describes two final-loop coding rounds: one build-from-scratch,
      one refactor-and-fix of existing code, with structure and tests valued over big-O.'
  - stage: System design
    round: system-design
    minutes: 60
    notes: Company-specific prompts are reported (webhook delivery, a Slack-style app with a two-week
      MVP, CI/CD, Design ChatGPT). Hello Interview advises against steering to GPU infrastructure unless
      the team needs it. A failed senior candidate (Oct 2024) found design the hardest part.
  - stage: Project presentation
    round: project-presentation
    minutes: 45
    notes: Slides expected; probing on trade-offs and personal ownership. Hello Interview's L5 guide says
      about 30 minutes plus Q&A, and that references may be requested at the end.
  - stage: Senior-manager behavioral
    round: behavioral
    minutes: 45
    notes: ''
  - stage: Team behavioral
    round: behavioral
    minutes: 30
    notes: ''
  distinctive:
  - OpenAI's guide (seen only as a search snippet) describes a skills assessment, then a final loop of
    about 4–6 hours with 4–6 interviewers over 1–2 days, virtual by default with an optional San Francisco
    onsite.
  - 'Forward Deployed Engineer loops differ: a one-week take-home (semantic search over Amazon products
    that ChatGPT can call) with a walkthrough, an AI-enabled coding screen and a final panel; another
    first-hand FDE account describes about 5 hours of building on OpenAI''s APIs plus a recorded video.'
  - 'Leveling reports conflict: interviewing.io says OpenAI "has a reputation for downleveling candidates
    coming in"; a Blind commenter tagged OpenAI says hiring is biased toward staff+. No first-hand down-leveling
    account was found.'
  - Some coding rounds are reported as math-heavy (KL divergence, cross-entropy), per interviewing.io.
  confidence: medium
  sources:
