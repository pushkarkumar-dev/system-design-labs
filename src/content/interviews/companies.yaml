      then an AI-assisted maze problem.
  - stage: Coding (no AI)
    round: coding-dsa
    minutes: 45
    notes: Kept alongside the AI round for E6 and below, per prep sites. It was 45 minutes in an Oct 2025
      E4 infra account.
  - stage: AI-enabled coding
    round: ai-assisted-coding
    minutes: 60
    notes: 'A multi-file CoderPad project in three phases: fix a bug, implement the core logic, optimize
