  - s-74b419b5c0
  - s-4d55d9b987
  - s-05342b6eb9
  - s-812dbc9385
  - s-713b2d5493
  - s-9b6948bd20
  - s-f837dcf278
  lastVerified: '2026-10-11'
anthropic:
  name: Anthropic
  kind: frontier-lab
  tracks:
  - ai-engineer
  - ai-infra
  aiToolPolicy:
    status: banned-except
    detail: 'Official guidance (updated 2025-07-10): no AI in live interviews or on take-homes unless
      Anthropic says otherwise; a Jan 2026 engineering post says AI is explicitly allowed on the performance-engineering
      take-home. An Aced prep guide claims AI is allowed in coding, which conflicts with the official
      page.'
    asOf: 2026-01
    sources:
    - s-b4d190c38f
    - s-a8c29f7dce
    - s-e23c30a3c6
  loop:
  - stage: Online assessment
    round: practical-coding
    minutes: 90
    notes: CodeSignal with levels you work through; a commenter finished in 65 of 90 minutes (Blind thread,
      2024). An infra prep guide describes a 55-minute CodeSignal or Replit screen instead.
  - stage: Recruiter call
    round: recruiter-screen
    notes: ''
  - stage: Hiring manager
    round: hiring-manager
    notes: Came after the recruiter call in a first-hand Senior (Safeguards) account.
  - stage: Coding
    round: practical-coding
    minutes: 60
    notes: 'Practical and multi-step, not puzzle-heavy: turning profiler samples into execution traces
      (Senior, ~2025); an image-processing pipeline over a provided project''s files (Staff infra, 2025).
      A 2025 MLE account reports a Colab exercise with no AI tools allowed.'
  - stage: System design
    round: system-design
    minutes: 60
    notes: 'Done in a Google Doc in one account; it opened as ''implement an API'' for sampling from LLMs
      with batching and request orchestration. Infra examples: distributing a large file to many machines
      over limited bandwidth; batching inference on limited hardware.'
  - stage: Project deep dive
    round: project-presentation
    minutes: 60
    notes: A 15–25 minute presentation, per an infra prep guide. A Senior Staff candidate was asked whether
      a project costing about $20M in engineer time was worth it.
  - stage: Values / culture
    round: values
    minutes: 60
    notes: Run by non-technical interviewers in one account, described as 'like a therapy session', and
      included critiquing Anthropic's mission.
  - stage: Behavioral
    round: behavioral
    minutes: 60
    notes: Listed separately from the culture round in the infra prep guide.
  - stage: Second coding round
    round: practical-coding
    notes: 'Senior (Safeguards) account: an LRU cache that grew more complex in stages, with serialization
      follow-ups.'
  - stage: Performance take-home (performance roles)
    round: take-home
    minutes: 120
    notes: Optimize code for a simulated accelerator (VLIW, SIMD, scratchpad memory); AI allowed. The
      4-hour version became a 2-hour one after Claude Opus 4 beat most humans (GitHub README); the blog
      gives scheduling delays as the reason for the shorter limit. After Claude Opus 4.5 matched the best
      2-hour human score, Anthropic switched to puzzle-style problems and published the original as a
      public challenge.
  distinctive:
  - 'The values round is where candidates most often report failing: a recruiter warned about it up front
    in one first-hand account, interviewing.io relays the same recruiter line, and a Senior Staff candidate
    on Blind (plus one commenter) blames it for a rejection. Other rejected Staff candidates blamed their
    coding or system design rounds instead.'
  - 'Official careers page: about half of technical staff had no prior ML experience, engineers should
    apply as engineers, and no feedback is given on interviews.'
  - 'Senior loops include judgment formats: a Staff SWE phone screen that was a design-doc review of a
    batch sampling service, and an Engineering Manager (Data Infrastructure) round critiquing a half-built
    inference design.'
  - 'Loop shape varies: onsite minutes come from a prep guide (5 × 60 min); some teams reportedly split
    the onsite and decide midway whether to continue; references may be requested early.'
  confidence: high
