amazon:
  name: "Amazon / AWS"
  kind: big-tech
  tracks: [ai-engineer, ai-infra]
  aiToolPolicy:
    status: banned-except
    detail: "Business Insider (Feb 2025, quoted by ITPro) reported guidelines telling candidates not to use GenAI tools in interviews unless explicitly permitted, with disqualification possible. Amazon's own careers news says its redesigned SDE technical assessment lets candidates work with an interactive AI assistant on a real coding platform (page undated; tools expanding in 2026 and beyond)."
    asOf: "2026"
    sources: [s-102d0e0e4f, s-62a8587fd2, s-6aabb0c00d]
  loop:
    - { stage: "Assessments", round: coding-dsa, notes: "Amazon says the SDE technical assessment now includes an interactive AI assistant (official, undated)" }
    - { stage: "Phone screening", round: coding-dsa }
    - { stage: "Interview loop: coding", round: coding-dsa, notes: "Amazon says the process differs from role to role; the round mix is not described officially. Answers are assessed against the Leadership Principles" }
    - { stage: "Interview loop: system design", round: system-design, notes: "Commonly reported for SDE loops; not listed on Amazon's own pages" }
    - { stage: "Bar Raiser", round: behavioral, notes: "An interviewer from outside the hiring team; Amazon says there are 3,600+ Bar Raisers" }
  distinctive:
    - "Amazon says it pilots real-time interview transcription and records only with explicit candidate consent"
    - "Two Sep-Oct 2026 PracHub SWE accounts describe an online-assessment task labelled 'AI debug' (fix bugs in a small backend); a SDE-1 snippet also mentions a 'GenAI fluency' round (unverified)"
    - "Applied Scientist aggregator titles: parallelism and collectives in training; stable sigmoid, softmax and scaled dot-product attention; a GRPO deep dive"
    - "No first-hand senior loop found for AWS AGI, Bedrock or Neuron/Trainium teams"
  confidence: high
  sources: [s-aec7b4af54, s-2734934856, s-6aabb0c00d, s-102d0e0e4f, s-62a8587fd2, s-d6e0865e0f, s-6bb76a58fe, s-26efabd25c]
  lastVerified: "2026-10-11"

