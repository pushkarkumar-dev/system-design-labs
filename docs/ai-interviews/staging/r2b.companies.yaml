# R2b company entries (goal-1 companies only). Every claim is reported, not fact. Evidence and caveats:
# docs/ai-interviews/research/10-company-gaps-and-verifications.md
google:
  name: "Google"
  kind: big-tech
  tracks: [ai-engineer, ai-infra]
  aiToolPolicy:
    status: pilot
    detail: "Google confirmed a pilot from H2 2026: a 'code comprehension' round with Gemini as the approved assistant, graded on prompting, output validation and debugging. It covers junior and mid-level roles on select US teams (reported: Google Cloud, Platforms & Devices), not Senior/Staff. No first-hand report of the Gemini round found as of 2026-10-11."
    asOf: "2026-05"
    sources: [s-b88d89c103, s-90bac7273b, s-e5567e3f2c, s-1450d1ec56]
  loop:
    - { stage: "Recruiter screen", round: recruiter-screen, notes: "Then one or two technical phone screens (prep-site report)" }
    - { stage: "Phone screen", round: coding-dsa }
    - { stage: "Onsite coding", round: coding-dsa, notes: "4-5 onsite rounds in total are reported; onsite may be virtual or in person" }
    - { stage: "System design", round: system-design, notes: "At L5 the candidate is expected to drive scope; an optional second design round reportedly tests the L5/L6 boundary" }
    - { stage: "Googleyness & Leadership", round: behavioral, notes: "Reported (May 2026) to add a technical design discussion of a past project" }
    - { stage: "Code comprehension (pilot)", round: ai-assisted-coding, notes: "Read, debug and optimize existing code with Gemini; H2 2026 pilot, junior/mid only" }
  distinctive:
    - "A hiring committee, not the interviewers, decides; team match afterwards reportedly takes 2-6 weeks for many candidates (prep-site report)"
    - "interviewing.io reported an in-person pilot of 2 virtual + 3-4 in-person rounds (Oct 2025); 2026 candidate reports describe both virtual and in-person onsites"
    - "A 1point3acres listing says a Google Cloud AI L6 onsite emphasized system design and LLM knowledge (title only)"
    - "An aced.io report says the no-AI code comprehension format is already used for engineering managers (one L6 EM account)"
  confidence: medium
  sources: [s-b88d89c103, s-90bac7273b, s-e5567e3f2c, s-bea47a5de6, s-a090f314d0, s-3bb155e6ba, s-33ab0ba309, s-3ec202cfd0, s-4e3fbcaea8]
  lastVerified: "2026-10-11"

