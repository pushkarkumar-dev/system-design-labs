meta:
  name: Meta
  kind: big-tech
  tracks:
  - ai-engineer
  - ai-infra
  aiToolPolicy:
    status: some-rounds
    detail: 404 Media reported the plan from internal Meta communications (Jul 2025). Prep sites and a Blind
      candidate date the rollout to about October 2025, with one of the two onsite coding rounds AI-enabled and a
      classic no-AI round kept for most levels. A July 2026 MLE candidate reported two AI-coding rounds, so the
      mix varies by role.
    asOf: 2026-07
    sources:
    - s-709cf19c59  # 404 Media: Meta is going to let job candidates use AI during coding tests
    - s-c670decb7a  # TechRadar: Meta is going to let candidates use AI in job interviews
    - s-810bf5f1ff  # Hello Interview: Inside Meta's AI-enabled coding interview
    - s-443984bc07  # PracHub: Meta MLE interview experience: four-round onsite, rejected after two A
  loop:
  - stage: Online assessment
    round: coding-dsa
    notes: Listed for E5 by Hello Interview; its format is not detailed in this research.
  - stage: Phone screen
    round: coding-dsa
    notes: A first-hand Aug 2026 SWE screen opened with explaining an AI system the candidate had built, then an
      AI-assisted maze problem.
  - stage: Coding (no AI)
    round: coding-dsa
    minutes: 45
    notes: Kept alongside the AI round for E6 and below, per prep sites. It was 45 minutes in an Oct 2025 E4 infra
      account.
  - stage: AI-enabled coding
    round: ai-assisted-coding
    minutes: 60
    notes: 'A multi-file CoderPad project in three phases: fix a bug, implement the core logic, optimize for larger
      inputs. The assistant answers in chat only and you pick the model. Graded on problem solving, code quality,
      verification and communication, not prompting; interviewing.io says Meta''s materials call AI use ''optional''.'
  - stage: System or product design
    round: system-design
    notes: Design rounds most drive the level decision at E6; prep sites say Staff+ candidates must pass both design
      rounds.
  - stage: Behavioral
    round: behavioral
    notes: E6 candidates may get a leadership assessment before the onsite (interviewing.io).
  distinctive:
  - 'Scope conflict: Hello Interview says the AI round covers candidates up to E7/M2; interviewing.io says E7+/M1
    get only one coding round and it is AI-assisted. No Meta documentation was found.'
  - 'Calibration cuts both ways: a July 2026 MLE candidate was told ''less manual work, more on AI'', while an E7
    candidate said Claude Sonnet kept giving wrong answers, so he wrote the code himself.'
  - For an E6 'AI native' role, a candidate relayed the recruiter's outline as two AI-enabled coding rounds, two
    design rounds and a behavioral; commenters added that coding is effectively pass/fail and design and behavioral
    set the level (Blind, Mar 20, year not shown).
  - 'Stricter proctoring since 2025: interviewers must flag suspected cheating, and most interviews require full-screen
    sharing with background blur off.'
  confidence: medium
  sources:
