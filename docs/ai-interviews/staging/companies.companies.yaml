# Staged by the Data: Companies agent, 2026-10-11.
# Company claims are as reported by the cited sources, not verified facts.
# Confidence: low = single accounts, snippets or prep sites only; medium = several
# consistent reports or news; high = official material plus consistent first-hand accounts.
openai:
  name: OpenAI
  kind: frontier-lab
  tracks:
  - ai-engineer
  - ai-infra
  aiToolPolicy:
    status: banned-except
    detail: interviewing.io reports AI tools are banned except in a beta 'agentic coding' onsite round that not
      every candidate gets. A first-hand 2026 Forward Deployed Engineer account describes an AI-enabled live coding
      screen; OpenAI's own guide could not be read (403).
    asOf: '2026'
    sources:
    - s-74b419b5c0  # interviewing.io: OpenAI interview process and questions
    - s-05342b6eb9  # Aced: OpenAI Forward Deployed Engineer interview experience
  loop:
  - stage: Recruiter call
    round: recruiter-screen
    minutes: 30
    notes: Per interviewing.io.
  - stage: Technical screen
    round: practical-coding
    minutes: 60
    notes: CoderPad. Coding is reported as practical, multi-part builds (a credit-tracking service, a resumable
      iterator, a small database) rather than LeetCode puzzles.
  - stage: System design screen
    round: system-design
    minutes: 60
    notes: Excalidraw.
  - stage: Agentic coding (beta)
    round: ai-assisted-coding
    notes: 'Onsite, not given to every candidate: work with an AI agent on a large existing codebase. Reported by
      interviewing.io only; not confirmed by OpenAI.'
  - stage: Coding
    round: practical-coding
    minutes: 60
    notes: 'A Glassdoor candidate (snippet) describes two final-loop coding rounds: one build-from-scratch, one
      refactor-and-fix of existing code, with structure and tests valued over big-O.'
  - stage: System design
    round: system-design
    minutes: 60
    notes: Company-specific prompts are reported (webhook delivery, a Slack-style app with a two-week MVP, CI/CD,
      Design ChatGPT). Hello Interview advises against steering to GPU infrastructure unless the team needs it.
      A failed senior candidate (Oct 2024) found design the hardest part.
  - stage: Project presentation
    round: project-presentation
    minutes: 45
    notes: Slides expected; probing on trade-offs and personal ownership. Hello Interview's L5 guide says about
      30 minutes plus Q&A, and that references may be requested at the end.
  - stage: Senior-manager behavioral
    round: behavioral
    minutes: 45
    notes: ''
  - stage: Team behavioral
    round: behavioral
    minutes: 30
    notes: ''
  distinctive:
  - OpenAI's guide (seen only as a search snippet) describes a skills assessment, then a final loop of about 4–6
    hours with 4–6 interviewers over 1–2 days, virtual by default with an optional San Francisco onsite.
  - 'Forward Deployed Engineer loops differ: a one-week take-home (semantic search over Amazon products that ChatGPT
    can call) with a walkthrough, an AI-enabled coding screen and a final panel; another first-hand FDE account
    describes about 5 hours of building on OpenAI''s APIs plus a recorded video.'
  - 'Leveling reports conflict: interviewing.io says OpenAI "has a reputation for downleveling candidates coming
    in"; a Blind commenter tagged OpenAI says hiring is biased toward staff+. No first-hand down-leveling account
    was found.'
  - Some coding rounds are reported as math-heavy (KL divergence, cross-entropy), per interviewing.io.
  confidence: medium
  sources:
  - s-5f2f87625a  # OpenAI: OpenAI interview guide
  - s-74b419b5c0  # interviewing.io: OpenAI interview process and questions
  - s-4d55d9b987  # Hello Interview: OpenAI L5 interview guide
  - s-05342b6eb9  # Aced: OpenAI Forward Deployed Engineer interview experience
  - s-812dbc9385  # gaijineer.co: OpenAI Forward Deployed Engineer interview process
  - s-713b2d5493  # Glassdoor: OpenAI interview reviews
  - s-9b6948bd20  # codingbff (Substack): I failed the OpenAI senior software engineer interview
  - s-f837dcf278  # Blind: What does it take to get into Anthropic/OpenAI?
  lastVerified: '2026-10-11'
anthropic:
  name: Anthropic
  kind: frontier-lab
  tracks:
  - ai-engineer
  - ai-infra
  aiToolPolicy:
    status: banned-except
    detail: 'Official guidance (updated 2025-07-10): no AI in live interviews or on take-homes unless Anthropic
      says otherwise; a Jan 2026 engineering post says AI is explicitly allowed on the performance-engineering take-home.
      An Aced prep guide claims AI is allowed in coding, which conflicts with the official page.'
    asOf: 2026-01
    sources:
    - s-b4d190c38f  # Anthropic: Guidance on candidates' AI usage
    - s-a8c29f7dce  # Anthropic: Designing AI-resistant technical evaluations
    - s-e23c30a3c6  # Aced: Anthropic Infrastructure Software Engineer interview guide
  loop:
  - stage: Online assessment
    round: practical-coding
    minutes: 90
    notes: CodeSignal with levels you work through; a commenter finished in 65 of 90 minutes (Blind thread, 2024).
      An infra prep guide describes a 55-minute CodeSignal or Replit screen instead.
  - stage: Recruiter call
    round: recruiter-screen
    notes: ''
  - stage: Hiring manager
    round: hiring-manager
    notes: Came after the recruiter call in a first-hand Senior (Safeguards) account.
  - stage: Coding
    round: practical-coding
    minutes: 60
    notes: 'Practical and multi-step, not puzzle-heavy: turning profiler samples into execution traces (Senior,
      ~2025); an image-processing pipeline over a provided project''s files (Staff infra, 2025). A 2025 MLE account
      reports a Colab exercise with no AI tools allowed.'
  - stage: System design
    round: system-design
    minutes: 60
    notes: 'Done in a Google Doc in one account; it opened as ''implement an API'' for sampling from LLMs with batching
      and request orchestration. Infra examples: distributing a large file to many machines over limited bandwidth;
      batching inference on limited hardware.'
  - stage: Project deep dive
    round: project-presentation
    minutes: 60
    notes: A 15–25 minute presentation, per an infra prep guide. A Senior Staff candidate was asked whether a project
      costing about $20M in engineer time was worth it.
  - stage: Values / culture
    round: values
    minutes: 60
    notes: Run by non-technical interviewers in one account, described as 'like a therapy session', and included
      critiquing Anthropic's mission.
  - stage: Behavioral
    round: behavioral
    minutes: 60
    notes: Listed separately from the culture round in the infra prep guide.
  - stage: Second coding round
    round: practical-coding
    notes: 'Senior (Safeguards) account: an LRU cache that grew more complex in stages, with serialization follow-ups.'
  - stage: Performance take-home (performance roles)
    round: take-home
    minutes: 120
    notes: Optimize code for a simulated accelerator (VLIW, SIMD, scratchpad memory); AI allowed. The 4-hour version
      became a 2-hour one after Claude Opus 4 beat most humans (GitHub README); the blog gives scheduling delays
      as the reason for the shorter limit. After Claude Opus 4.5 matched the best 2-hour human score, Anthropic switched to
      puzzle-style problems and published the original as a public challenge.
  distinctive:
  - 'The values round is where candidates most often report failing: a recruiter warned about it up front in one
    first-hand account, interviewing.io relays the same recruiter line, and a Senior Staff candidate on Blind (plus
    one commenter) blames it for a rejection. Other rejected Staff candidates blamed their coding or system design
    rounds instead.'
  - 'Official careers page: about half of technical staff had no prior ML experience, engineers should apply as
    engineers, and no feedback is given on interviews.'
  - 'Senior loops include judgment formats: a Staff SWE phone screen that was a design-doc review of a batch sampling
    service, and an Engineering Manager (Data Infrastructure) round critiquing a half-built inference design.'
  - 'Loop shape varies: onsite minutes come from a prep guide (5 × 60 min); some teams reportedly split the onsite
    and decide midway whether to continue; references may be requested early.'
  confidence: high
  sources:
  - s-131d7342e9  # Anthropic: Anthropic careers: how we hire
  - s-b4d190c38f  # Anthropic: Guidance on candidates' AI usage
  - s-a8c29f7dce  # Anthropic: Designing AI-resistant technical evaluations
  - s-90e7a87996  # Anthropic (GitHub): anthropics/original_performance_takehome
  - s-42f1c7f6dd  # Aced: Anthropic Senior Software Engineer (Safeguards) interview experience
  - s-e23c30a3c6  # Aced: Anthropic Infrastructure Software Engineer interview guide
  - s-bd515a7829  # Hello Interview: Anthropic interview guide
  - s-6a7cff749e  # Blind: Anthropic CodeSignal experience
  - s-4edc43db4e  # interviewing.io: Anthropic interview process and questions
  - s-e98cbef9cd  # Blind: I think the culture round sank my Anthropic Sr Staff loop
  - s-e9fee3985a  # Aced: Anthropic Staff Software Engineer (Infra) interview experience
  - s-eab681003c  # Aced: Anthropic Staff Software Engineer interview experience (design-doc rev
  - s-4e3dc29a95  # Aced: Anthropic Engineering Manager (Data Infra) interview experience
  - s-8f304f761b  # Aced: Anthropic Machine Learning Engineer (Safety Fellow) interview experien
  lastVerified: '2026-10-11'
