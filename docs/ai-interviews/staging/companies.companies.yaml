    - s-bea47a5de6  # Moneywise (via Yahoo Finance): Google's planned AI-assisted interview pilot
  loop:
  - stage: Coding
    round: coding-dsa
    notes: Still algorithmic, with fewer LeetCode-style and more multi-part questions (Pragmatic Engineer, Sep 2025).
      A first-hand Oct 2026 in-person onsite included a train-schedule coding question.
  - stage: AI-assisted code comprehension (pilot)
    round: ai-assisted-coding
    notes: 'Planned for junior and mid-level roles on select US teams (Storyboard18 says Google Cloud): read, debug
      and optimize existing code with Gemini, graded on prompting, output validation and debugging.'
  - stage: System design
    round: system-design
    notes: A first-hand Oct 2026 onsite had a 'solutions design' round on an LLM review-summarization platform (prompt
      injection, PII). An L6 guide (snippet) says strong coding with L5-level design can lead to down-leveling.
  - stage: Googleyness
    round: values
    notes: Listed with coding, design and a hiring committee as the Google senior loop in a DeepMind prep guide.
  distinctive:
  - 'In-person rounds are back: Pichai said in June 2025 that Google would add at least one, and interviewing.io
    reported an in-person pilot (two virtual rounds, then three or four in person) finished by Oct 2025. A first-hand
    Oct 2026 report describes an in-person onsite.'
  - Recruiting VP Brian Ong said the AI pilot is meant 'to be more reflective of how our teams are operating in
    the AI era.'
  - This research found no first-hand Senior SWE or AI-infra loop at Google.
