llm-judge:
  id: llm-judge
  title: "LLM-as-judge and human labels: when to trust automated grading"
  track: ai-engineer
  format: deep-dive
  canonicalPrompt: >-
    Build an LLM judge that scores faithfulness and relevance and calibrate it against about 30 human-labeled
    pairs. Report agreement (accuracy, Cohen's kappa), compare it with agreement between human annotators,
    find its biases (position, length, self-preference), and decide when it may replace humans. Then extend
    the approach to outputs people judge by taste, such as generated video, using pairwise preferences and
    rubrics.
  questions:
    - eng-040
    - eng-042
    - r2a-009
    - r2b-010
  variants: >-
    eng-040 is the take-home: build and calibrate the judge on 30 pairs. eng-042 asks how you know a judge is
    reliable. r2b-010 (Apple) starts from inter-annotator agreement. r2a-009 (Amazon) is metrics for a
    video-generation model when users judge by subjective standards.
  companies:
    - amazon
    - apple
    - applied-ai-generic
  priority: 2
  existingWalkthrough: null
  smallTeamRelevance: >-
    Small teams rely on LLM judges because they cannot pay for labelers, which makes a 30-label calibration
    check the cheapest insurance against optimizing toward a broken metric.
  labs:
    - lab: llm-eval
      status: proof
  gapLabs:
    - llm-judge-evals
agent-tool-permissions:
