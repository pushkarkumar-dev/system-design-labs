eval-system:
  id: eval-system
  title: "Know whether an LLM feature is good: error analysis, eval sets, release gates, production metrics"
  track: ai-engineer
  format: design
  canonicalPrompt: >-
    Build an assistant over a bank's internal policies (or a support agent) and decide whether it is good
    enough to roll out to the next team. Turn complaints like 'it feels dumb' into labeled failure cases,
    build golden sets from real traffic, choose graders (code checks, a calibrated LLM judge, human review,
    with human checkpoints in regulated flows), compare versions with confidence intervals, gate every prompt
    or model swap in CI, then shadow and canary and track the production metrics (task success, containment,
    escalation, harm signals) that tell you whether it helps or hurts users.
