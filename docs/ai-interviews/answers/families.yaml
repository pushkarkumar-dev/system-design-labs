bh-drive-decisions:
  id: bh-drive-decisions
  title: "Drive decisions and own the outcome: buy-in, pushback, being wrong"
  track: cross
  format: behavioral
  canonicalPrompt: >-
    Describe a technical decision you drove and how you got buy-in. Expect follow-ups that test the same
    competency from other sides: influencing a peer who disagreed, telling an executive a timeline was
    unrealistic and explaining a system's limits to non-technical people, turning customer feedback into a
    core product change, a time you were confident and turned out to be wrong, and an infrastructure failure
    you owned that hit a customer.
  questions:
    - eng-107
    - eng-110
    - eng-113
    - eng-114
    - infra-105
    - infra-111
  variants: >-
    infra-105 (Anthropic) is the core question, where 'too wordy' was a self-reported rejection reason.
    eng-113 (OpenAI, Staff) is influencing a peer. eng-110 (OpenAI) covers difficult deployments, ambiguity
    and the unrealistic-timeline story. eng-114 (Cohere VP round) is customer feedback to product with buy-in.
    eng-107 (Anthropic values) is being confidently wrong. infra-111 (Modal) is a customer-facing failure you
    owned and a bold decision that could have failed.
  companies:
    - anthropic
    - cohere
    - modal
    - openai
  priority: 1
  existingWalkthrough: null
  smallTeamRelevance: >-
    At a small company the AI owner drives most technical decisions without a committee, so evidence of
    earning buy-in and owning failures is what the hiring manager screens for.
