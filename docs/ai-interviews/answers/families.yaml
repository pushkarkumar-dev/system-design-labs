agentic-workflow-design:
  id: agentic-workflow-design
  title: Agent or workflow? Designing multi-step LLM automation
  track: ai-engineer
  format: design
  canonicalPrompt: >-
    Design an AI system that automates an internal process, such as raising a service's test coverage, routing
    engineering pings, or scoring documents against a rule set, and decide where it should be deterministic
    code, where a single LLM call, and where an agent with tools. Cover how the agent's output is verified
    (which checks stay human, how a bad agent-written change is caught), long-running execution (state,
    resumability, timeouts), when several agents are really worth it and how they avoid conflicting edits, and
    how you are alerted when it fails.
