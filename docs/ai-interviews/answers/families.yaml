# Answer families for the AI Interviews question bank (src/content/interviews/questions.yaml).
# One family = one underlying problem a deep walkthrough can teach; every question id appears in exactly one family.
# Each question also gets a short answer card that points to its family and covers what is specific to that variant.
# Generated 2026-10-12 from 278 questions into 49 families. See families.md for the table and rationale.
#
# Fields
#   track               ai-engineer | ai-infra | cross (cross = mixed tracks, AI-assisted rounds, classic coding, behavioral)
#   format              design | coding | estimation | deep-dive | behavioral
#   priority            1 = asked widely or featured and central to the target reader; 3 = narrow or frontier-only
#   existingWalkthrough the current walkthrough (src/content/interviews/walkthroughs/) this family would replace or absorb;
#                       injection-safe-pipeline, ai-assisted-coding-round, llm-batcher-to-fleet, gpu-fleet-scheduler-multilora
#                       and roofline-back-of-envelope are each split across two families (see families.md)
#   smallTeamRelevance  why it matters to the engineer owning AI at a 50-500 person company; starts with "low:" when it barely does
#   labs[].status       from src/lib/interviews/labStatus.ts: proof | partial (incl. failing tests) | not-llm | needs-measurement
#   gapLabs             planned labs (PLANNED_LABS in labStatus.ts) the walkthrough would cite as gaps

rag-system-design:
  id: rag-system-design
  title: Design a RAG system end to end and justify every knob
  track: ai-engineer
  format: design
  canonicalPrompt: >-
    Design an assistant that answers questions over a customer's private documents, starting from one 200-page
    PDF and growing to large volumes of mixed-format files. Walk ingestion (parsing, structure-aware chunking,
    embedding, indexing, re-indexing when documents or the embedding model change) and query time (query
    rewriting, hybrid retrieval, choosing k, reranking, prompt assembly with citations, saying 'I don't know'
    when the context is missing). For each knob give the number you would pick, why it depends on this corpus
    and these questions, and how you would measure it; then say where the design fails and when retrieval is
    the wrong tool.
  questions:
    - eng-001
    - eng-003
    - eng-006
    - eng-007
    - eng-008
    - eng-017
    - r2a-001
    - r2a-003
  variants: >-
    eng-001 is the bare prompt and eng-006 traces one question through a 200-page PDF. eng-007, eng-008 and
    eng-017 are deep-dive versions on chunk size, k, embeddings, reranking and documents bigger than the
    context window. eng-003 (Databricks) is only the ingestion half, at volume and with mixed formats. r2a-001
    (Google, infra-titled role) adds troubleshooting after the walk-through. r2a-003 (DeepMind) is a
    recruiter's area list that adds model choice, quantization/distillation and evals.
  companies:
    - applied-ai-generic
    - databricks
    - google
    - google-deepmind
    - openai
    - promptlayer
  priority: 1
  existingWalkthrough: null
  smallTeamRelevance: >-
    RAG over the company's own documents is the first AI feature most 50-500 person companies ship, and the
    one engineer who owns it makes every chunking, k and reranking call alone.
  labs:
    - lab: rag
      status: proof
    - lab: vector-index
      status: proof
    - lab: embedding-pipeline
      status: proof
    - lab: search-engine
      status: needs-measurement
    - lab: llm-eval
      status: proof
  gapLabs: []
enterprise-rag-acl:
  id: enterprise-rag-acl
  title: Permission-aware enterprise RAG and search
  track: ai-engineer
  format: design
  canonicalPrompt: >-
    Design a multi-tenant enterprise assistant in the style of ChatGPT Enterprise or Glean over many
    connectors (Drive, Slack, email, wikis): hybrid keyword and vector retrieval, reranking, citations, and
    permissions enforced so no user ever sees a passage from a document they cannot open. Decide where the ACL
    check runs (filter inside retrieval or after ranking), put a number on how long a deleted or revoked
    document can still be cited, keep results fresh after a connector outage, and cut latency and cost for the
    most frequent questions.
  questions:
    - eng-002
    - eng-004
    - eng-005
    - r2a-024
  variants: >-
    eng-002 (OpenAI) adds domain-tuning the embedding model and caching frequent questions. eng-004 (Glean)
    stresses separating indexing from serving and connector freshness. eng-005 (Google) is federated personal
    search across email, calendar, documents and chat. r2a-024 (Cohere) turns it into a research assistant
    that writes a cited report, with similarity caching and what happens when a downstream party's access is
    revoked.
  companies:
    - cohere
    - glean
    - google
    - openai
  priority: 1
  existingWalkthrough: enterprise-rag-acl
  smallTeamRelevance: >-
    As soon as an internal assistant indexes Drive, Slack or Confluence, one leaked HR or legal passage is a
    real incident, so a small team has to get ACL filtering and deletion lag right from the first release.
  labs:
    - lab: rag
      status: proof
    - lab: vector-index
      status: proof
    - lab: embedding-pipeline
      status: proof
    - lab: search-engine
      status: needs-measurement
    - lab: oauth-provider
      status: proof
    - lab: llm-eval
      status: proof
  gapLabs:
    - llm-judge-evals
rag-quality-debugging:
  id: rag-quality-debugging
  title: Measure retrieval and debug confident wrong answers
  track: ai-engineer
  format: deep-dive
  canonicalPrompt: >-
    A RAG chatbot gives confident but wrong answers, some of them in high-risk contexts. Separate retrieval
    failures from generation failures: build a labeled query set, measure retrieval with recall@k, MRR and
    NDCG (and say when each one fits), check whether answers are faithful to the retrieved context, then fix
    the failing stage (chunking, hybrid search, reranking, prompt constraints, abstention) and show the metric
    moved.
  questions:
    - eng-009
    - eng-016
    - eng-041
    - eng-045
  variants: >-
    eng-009 (OpenAI) asks only how to measure whether retrieval fetches the right context. eng-041 asks for
    the definitions and use of recall@k, MRR and NDCG. eng-016 (Mistral) is the debugging story. eng-045
    (Anthropic) adds high-risk contexts, where mitigation means abstention, citations and human review rather
    than a better prompt.
  companies:
    - anthropic
    - applied-ai-generic
    - mistral
    - openai
  priority: 2
  existingWalkthrough: null
  smallTeamRelevance: >-
    When the only AI engineer gets a 'the bot made this up' ticket, they need a repeatable way to find the
    failing stage instead of editing the prompt and hoping.
  labs:
    - lab: rag
      status: proof
    - lab: llm-eval
      status: proof
    - lab: search-engine
      status: needs-measurement
    - lab: vector-index
      status: proof
    - lab: embedding-pipeline
      status: proof
  gapLabs:
    - llm-judge-evals
rag-in-code:
  id: rag-in-code
  title: Build a small RAG or semantic search in code, then measure it
  track: ai-engineer
  format: coding
  canonicalPrompt: >-
    In a notebook or a take-home, build a bare-bones RAG over a small corpus (say 50 markdown files or a
    product catalog): chunk, embed, write cosine top-k yourself, add BM25 or a reranker, and generate an
    answer with citations. Then build a 20 to 50 question eval set, report recall@5 or hit rate and
    faithfulness, and defend what changes at 100x the data, under rate limits, and for searches that need
    precise rather than fuzzy matches.
  questions:
    - eng-010
    - eng-011
    - eng-012
    - eng-013
    - eng-039
    - eng-064
    - eng-067
  variants: >-
    eng-010 (Harvey, Colab) adds recall and hit rate as a follow-up. eng-011 (Scale AI) wants it as clean
    object-oriented code. eng-012 (OpenAI, one-week take-home) is semantic product search, probed on how
    specific results should be. eng-013 (OpenAI, 5-hour take-home with video) probes chunking, alternative
    retrieval, 100x data, rate limits and retries. eng-039 is the 50-document, 20-question eval take-home.
    eng-064 (PromptLayer) debugs embedding-processing code. eng-067 (Amazon) is only cosine similarity in
    NumPy.
  companies:
    - amazon
    - applied-ai-generic
    - harvey
    - openai
    - promptlayer
    - scale-ai
  priority: 1
  existingWalkthrough: null
  smallTeamRelevance: >-
    A small team's first RAG is usually a few hundred lines one engineer writes and then has to prove works
